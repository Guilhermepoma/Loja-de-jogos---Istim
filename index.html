<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Istim — Loja de Jogos</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="imgs/image.png" type="image/png">
</head>
<body>

<!-- HEADER -->
<header>
    <div class="header-inner">
        <a class="logo" href="#">
            <img src="imgs/image.png" alt="Istim Logo">
            <span class="logo-text">Istim</span>
        </a>
        <nav>
            <a href="#" class="active">Loja</a>
            <a href="#">Biblioteca</a>
            <a href="#">Comunidade</a>
        </nav>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="abrirModalAdicionar()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Adicionar Jogo
            </button>
        </div>
    </div>
</header>

<!-- BANNER -->
<div class="page-banner">
    <div class="page-banner-inner">
        <img class="page-banner-logo" src="imgs/image.png" alt="Istim">
        <div>
            <h1>Loja de Jogos</h1>
            <p>Gerencie o catálogo de jogos disponíveis na plataforma</p>
        </div>
    </div>
</div>

<!-- MAIN -->
<main>
    <div class="toolbar">
        <div class="search-box">
            <span class="search-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input type="text" id="searchInput" placeholder="Pesquisar jogos..." oninput="filtrarJogos()">
        </div>
        <button class="btn btn-ghost btn-icon" onclick="carregarJogos()" title="Atualizar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <span class="game-count" id="gameCount"></span>
    </div>

    <div id="gamesList">
        <div class="loading">
            <div class="spinner"></div>
            <p style="color:var(--text-dim); font-size:13px;">Carregando jogos...</p>
        </div>
    </div>
</main>

<!-- MODAL ADICIONAR / EDITAR -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2 id="modalTitle">Adicionar Jogo</h2>
            <button class="modal-close" onclick="fecharModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editId">

            <div class="form-group">
                <label>Nome do Jogo</label>
                <input type="text" id="formNome" placeholder="Ex: Half-Life 3">
            </div>

            <div class="form-group">
                <label>Descrição</label>
                <input type="text" id="formDescricao" placeholder="Uma breve descrição do jogo">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Preço (R$)</label>
                    <input type="number" id="formValor" placeholder="0.00" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label>URL da Imagem</label>
                    <input type="text" id="formImg" placeholder="https://..." oninput="previewImagem()">
                </div>
            </div>

            <div class="img-preview" id="imgPreview">
                <img id="imgPreviewImg" src="" alt="Preview">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
            <button class="btn btn-primary" id="btnSalvarModal" onclick="salvarJogo()">Cadastrar Jogo</button>
        </div>
    </div>
</div>

<!-- CONFIRM DELETE -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <h3>Remover Jogo</h3>
        <p>Tem certeza que quer remover este jogo do catálogo? Esta ação não pode ser desfeita.</p>
        <div class="confirm-actions">
            <button class="btn btn-ghost" onclick="fecharConfirm()">Cancelar</button>
            <button class="btn btn-danger" id="btnConfirmDel">Remover</button>
        </div>
    </div>
</div>

<!-- TOASTS -->
<div class="toast-container" id="toastContainer"></div>

<script src="assets/js/app.js"></script>
</body>
</html>
