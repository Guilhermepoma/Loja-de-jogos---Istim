<html>
    <head>
        <title>Loja de Jogos</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <div class="container">
            <h2>Adicionar Jogo</h2>
            <input type="text" id="nome" placeholder="Nome">
            <input type="text" id="descricao" placeholder="Descrição">
            <input type="number" id="valor" placeholder="Valor" step="0.01" min="0">
            <input type="text" id="img" placeholder="URL da imagem">
            <button id="salvar">Cadastrar</button>

            <br><br>

            <button id="buscar">Buscar Jogos</button>
            <table id="resultado">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Ações</th>
                </tr>
            </table>

            <br>

            <div id="formEditar" style="display:none;">
                <h2>Atualizar Jogo</h2>
                <input type="hidden" id="editId">
                <input type="text" id="editNome" placeholder="Nome">
                <input type="text" id="editDescricao" placeholder="Descrição">
                <input type="number" id="editValor" placeholder="Valor" step="0.01" min="0">
                <input type="text" id="editImg" placeholder="URL da imagem">
                <button id="salvarEdicao">Salvar</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
